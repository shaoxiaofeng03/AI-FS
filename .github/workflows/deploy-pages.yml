name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # Actions 打卡使用的 GITHUB_TOKEN push 不会触发 push 事件（防递归），
  # 因此用 workflow_run 在打卡完成后补一次部署。
  workflow_run:
    workflows: ["每日打卡（Cloud Check-in）"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute base path
        id: base
        run: |
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            echo "base=${{ vars.BASE_PATH }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REPOSITORY#*/}" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build VitePress
        run: pnpm run docs:build
        env:
          BASE_PATH: ${{ steps.base.outputs.base }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
